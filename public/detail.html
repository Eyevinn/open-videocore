<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>open-videocore ops</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="detail-standalone">
  <!--
    Standalone (detached) detail view — issue #128. Renders exactly ONE asset or
    job detail with MINIMAL CHROME: no global header, no tab bar, no nav. Just a
    thin context strip (the stack label) plus the reused detail pane. It
    self-polls at the shared main-UI interval and intentionally does NOT boot the
    full tab UI (importing app.js here only reuses its renderers). No shared
    module state with the opener window.
  -->
  <main>
    <!--
      Issue #828: a detached window is its own JS realm and targets a stack via
      ?stack=, so it carries its own build indicator — an operator screenshotting
      a pop-out must be able to identify the build without going back to the main
      window. Both halves of the strip are spans inside the context row so the
      stack label and the build identity read as one line.
    -->
    <div class="detail-standalone-context">
      <span id="detail-stack-label"></span>
      <div id="build-indicator" class="build-indicator"></div>
    </div>
    <div id="content" class="content-fullbleed">
      <div class="assets-side" id="detail-root" style="display:flex;"></div>
    </div>
  </main>

  <script type="module" src="detail.js"></script>
</body>
</html>
