<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>open-videocore ops</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-brand">open-videocore ops</div>
    <nav class="header-nav">
      <label for="stack-select" class="header-label">Stack</label>
      <select id="stack-select" class="header-select">
        <option value="">— loading —</option>
      </select>
      <a href="/api-docs/" target="_blank" rel="noopener" class="header-link">API docs ↗</a>
    </nav>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="assets">Assets</button>
    <button class="tab-btn" data-tab="jobs">Jobs</button>
    <button class="tab-btn" data-tab="logs">Logs</button>
    <button class="tab-btn" data-tab="audit">Audit</button>
    <button class="tab-btn" data-tab="transcoders">Transcoders</button>
    <button class="tab-btn" data-tab="pipelines">Pipelines</button>
    <button class="tab-btn" data-tab="profiles">Profiles</button>
    <button class="tab-btn" data-tab="collections">Collections</button>
    <!-- Issue #913: this is the only tab whose results include collections as
         well as assets (GET /api/v1/search/ returns both arrays), so the label
         says "everything" rather than leaving the scope to be guessed.
         Issue #948: no hover-only tooltip here. The Assets tab now has a
         free-text box of its own that returns assets only, but that
         distinction is carried by the .search-tab-intro paragraph the tab
         renders, which assistive tech announces — a `title` attribute is not
         reliably surfaced to screen readers or to keyboard users tabbing the
         strip, and it would only repeat the visible label. -->
    <button class="tab-btn" data-tab="search">Search everything</button>
    <button class="tab-btn" data-tab="webhooks">Webhooks</button>
    <button class="tab-btn" data-tab="storage">Storage</button>
    <button class="tab-btn" data-tab="provision">Provision</button>
  </nav>

  <main>
    <div id="content"></div>
  </main>

  <script>window.__OPS_MAIN__ = true;</script>
  <script type="module" src="app.js"></script>
</body>
</html>
