services:
  couchdb:
    image: apache/couchdb:3
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - couchdb-data:/opt/couchdb/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

  # Encryption-capable packager — LOCAL DEVELOPMENT ONLY (profile `local-drm`).
  #
  # WHY IT IS HERE. The OSC catalog packager cannot encrypt: no encryption option exists in
  # the packaging library, in the service's instance config, or in the queue envelope it
  # consumes, so the product's capability probe answers `encryption: false`
  # (`NO_ENCRYPTION_CAPABILITY`, src/pipeline/packaging.ts) and a protected package request is
  # refused with `409 drm_unsupported`. The upstream change is requested in the engagement's
  # friction log `docs/osc-feedback/incoming-packager-no-encryption-support.md` (ADR-008 §7.2).
  # Until it ships, the only way to prove the key-acquisition -> encrypt -> callback ->
  # delivery chain is a packager image you build yourself from the branch that adds encryption
  # support, which is what this service runs.
  #
  # It is behind a PROFILE, so `docker compose up` never starts it, and `pull_policy: never`,
  # so compose never tries to fetch a tag that exists only on your machine. Nothing in the OSC
  # cloud e2e environment uses it.
  #
  #   docker compose --profile local-drm up -d
  #   LOCAL_DRM_PACKAGER_IMAGE=<your tag> pnpm test test/drm-local-clearkey-chain.test.ts
  #
  # The test SKIPS (it does not fail) when the image is not present locally.
  #
  # The environment below carries the packager's documented instance-config surface —
  # `RedisUrl`, `RedisQueue`, `OutputFolder`, `AwsAccessKeyId`, `AwsSecretAccessKey`,
  # `S3EndpointUrl`, `CallbackUrl` (the fields recorded in the friction log from the packaging
  # service's own `readPackagingConfig()`), with the queue key and bucket taken from the
  # product's own defaults: `encore-packager:jobs` (`packagerQueueKey()`,
  # src/pipeline/osc-packager-queue.ts:33) and `openvideocore-packaged`
  # (`DEFAULT_PACKAGED_BUCKET`, src/pipeline/packaging.ts:89). The variable SPELLING belongs to
  # whichever build you tag — override any of them in `.env` if your build differs. No
  # credential is baked in: every value is an override with the same dev default the `minio`
  # service above already uses.
  packager-encrypting:
    profiles: ["local-drm"]
    image: ${LOCAL_DRM_PACKAGER_IMAGE:-open-videocore-local/encore-packager-encryption:dev}
    pull_policy: never
    depends_on:
      - minio
      - valkey
    environment:
      REDIS_URL: ${LOCAL_DRM_REDIS_URL:-redis://valkey:6379}
      REDIS_QUEUE: ${PACKAGER_QUEUE_KEY:-encore-packager:jobs}
      OUTPUT_FOLDER: s3://${LOCAL_DRM_PACKAGED_BUCKET:-openvideocore-packaged}/
      AWS_ACCESS_KEY_ID: ${LOCAL_DRM_S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_DRM_S3_SECRET_KEY:-minioadmin}
      S3_ENDPOINT_URL: ${LOCAL_DRM_S3_ENDPOINT:-http://minio:9000}
      # Where the packager reports completion. Empty by default: the local chain test polls the
      # packaged bucket and only asserts the callback when it is given a listener URL.
      CALLBACK_URL: ${LOCAL_DRM_CALLBACK_URL:-}

volumes:
  couchdb-data:
  minio-data:
