name: Update OpenAPI spec

on:
  push:
    branches: [main]
    paths-ignore:
      - openapi.json
      - public/docs/**

concurrency:
  group: update-openapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-openapi:
    name: Regenerate openapi.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate openapi.json
        run: pnpm generate:openapi
        env:
          OSC_ACCESS_TOKEN: ci-placeholder
          MINIO_ROOT_PASSWORD: ci-placeholder
          COUCHDB_ADMIN_PASSWORD: ci-placeholder

      # Reads the openapi.json just (re)generated above — no live server
      # needed. Keeps public/docs/ (guides, data model, and the per-resource
      # API reference pages) from ever drifting out of sync with the real
      # contract; see scripts/generate-docs.ts for what's generated vs.
      # hand-authored.
      - name: Generate docs (public/docs/)
        run: pnpm generate:docs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.json public/docs
          if git diff --cached --quiet; then
            echo "openapi.json and public/docs unchanged — nothing to commit"
          else
            git commit -m "chore(openapi): regenerate openapi.json and docs [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt/3) — rebasing onto latest main and retrying"
              git fetch origin main
              git rebase origin/main
            done
          fi
